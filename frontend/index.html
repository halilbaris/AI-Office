<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyOffice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23ff7a59%22/%3E%3Crect x=%229%22 y=%2211%22 width=%2214%22 height=%2210%22 rx=%223%22 fill=%22%23fff7f2%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#efe7da; --ink:#3b342c; --muted:#8a7f72; --coral:#ff7a59; --coral-dark:#e9603f;
  --glass:rgba(255,250,243,.72); --glass-edge:rgba(255,255,255,.8); --side-width:384px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 58%,transparent 58%,rgba(120,96,70,.14) 100%)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--glass-edge);box-shadow:0 10px 40px rgba(90,70,50,.12),0 1px 0 rgba(255,255,255,.6) inset;border-radius:18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h3.small{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;gap:28px;padding:0 20px;background:rgba(250,245,237,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(59,52,44,.08);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--coral);display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,122,89,.4)}
.logo i{width:13px;height:9px;border-radius:3px;background:#fff7f2;position:relative}
.logo i::before,.logo i::after{content:"";position:absolute;top:3px;width:3px;height:3px;border-radius:1px;background:var(--coral)}
.logo i::before{left:3px}.logo i::after{right:3px}
.brand b{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;margin-left:2px}
.tabs{display:flex;gap:4px;height:100%}
.tabs button{position:relative;padding:0 12px;font-size:14px;font-weight:500;color:#6d6357}
.tabs button:hover{color:var(--ink)}
.tabs button.selected{color:var(--ink);font-weight:600}
.tabs button.selected::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.topbar .spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.pill b{font-family:"Space Grotesk",sans-serif;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#b9ad9e;flex:none}
.dot.live{background:var(--coral);box-shadow:0 0 0 4px rgba(255,122,89,.18);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,122,89,.06)}}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.button{padding:7px 12px;font-size:13px;font-weight:500;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08);transition:background .15s,transform .15s}
.button:hover{background:#fff}.button:active{transform:scale(.97)}

/* greeting */
.greeting{position:fixed;top:78px;left:22px;width:330px;padding:10px 16px;z-index:3;cursor:pointer;
  transition:width .18s ease,padding .18s ease,box-shadow .2s ease}
.greeting .date{font-size:11px;color:var(--muted);font-weight:500;line-height:1.2}
.greeting h1{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:700;letter-spacing:-.02em;
  margin:1px 0 0;transition:font-size .18s ease}
.greeting .chev{float:right;margin-top:2px;color:var(--muted);font-size:11px;transition:transform .18s ease}
.greeting p{font-size:14px;line-height:1.5;color:#4d453c;max-height:0;opacity:0;overflow:hidden;
  margin:0;transition:max-height .22s ease,opacity .18s ease,margin .18s ease}
.greeting:hover,.greeting.expanded,.greeting:focus-visible{width:352px;padding:16px 20px}
.greeting:hover h1,.greeting.expanded h1,.greeting:focus-visible h1{font-size:27px}
.greeting:hover .date,.greeting.expanded .date{font-size:12px}
.greeting:hover p,.greeting.expanded p,.greeting:focus-visible p{max-height:240px;opacity:1;margin-top:8px}
.greeting:hover .chev,.greeting.expanded .chev{transform:rotate(180deg)}
.greeting p b{color:var(--ink)}
.greeting .summary-button{margin-top:12px;background:var(--ink);color:#fff7ee;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px}
.greeting .summary-button:hover{background:#2a241e}

/* side column */
.side{position:fixed;top:76px;right:16px;bottom:42px;width:var(--side-width);display:flex;flex-direction:column;gap:10px;z-index:3}
.sec{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
#needsSec{flex:0 0 auto;max-height:58%;min-height:112px}
.sec-head{display:flex;align-items:baseline;gap:8px;width:100%;padding:14px 16px 10px;text-align:left;cursor:pointer}
.sec-title{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em}
.sec-head small{font-size:11.5px;color:var(--muted)}
.sec-chev{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .2s}
.sec.collapsed .sec-body{display:none}
.sec.collapsed .sec-chev{transform:rotate(-90deg)}
.sec-body{display:flex;flex-direction:column;min-height:0;padding:0 12px 14px;gap:6px}
.sec-tools{display:flex;justify-content:flex-end;min-height:24px}
.dark.small{font-size:11.5px;padding:4px 10px;border-radius:8px}
.steps-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer}
.steps-toggle input{accent-color:var(--coral);width:12px;height:12px}
.stream li.step{display:none}
.stream.show-steps li.step{display:flex}
.today{display:flex;gap:14px;justify-content:space-between;padding:10px 16px;font-size:11.5px;color:var(--muted);flex:none}
.cards .empty{padding:14px 4px;font-size:12.5px;line-height:1.5;color:var(--muted);text-align:center}
.today b{color:var(--ink);font-size:13px}
.pill-results{color:var(--coral-dark);font-weight:600}
.pill-results::before{content:" · "}
.button.ghost{background:transparent;border:1px solid rgba(59,52,44,.14);color:#5d5348}
.done-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;
  color:var(--muted);padding:6px 2px 2px;border-top:1px dashed rgba(59,52,44,.12);margin-top:2px}
.done-head .later{background:transparent;border:0;color:var(--coral-dark);font-size:11.5px;font-weight:600;padding:2px 4px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(46,37,29,.34);backdrop-filter:blur(2px);z-index:9;display:grid;place-items:center;padding:40px 24px}
.modal[hidden]{display:none}
.modal-card{width:min(820px,92vw);max-height:78vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.modal-card header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(59,52,44,.1)}
.modal-card h3{font-family:"Space Grotesk",sans-serif;font-size:17px;margin:0}
.modal-card header small{font-size:11.5px;color:var(--muted)}
.modal-card pre{margin:0;padding:18px;overflow:auto;white-space:pre-wrap;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#3f372f}
.box{padding:16px 16px 12px;display:flex;flex-direction:column;min-height:0}
.box .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.box .head h2{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600}
.box .head small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.dark{background:var(--ink);color:#fff7ee;font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;white-space:nowrap}
.dark:hover{background:#2a241e}
.ceo-box{flex:0 1 auto;max-height:52%}
.cards{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.card.approved-card{opacity:.68}
.card pre.output{margin:8px 0 0;padding:10px;border-radius:10px;background:#f7efe5;color:#4b4137;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:260px;overflow:auto}
.card pre.output:empty{display:none}
.card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;animation:enter .35s ease}
.card .top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:500}
.avatar{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.avatar.photo{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(59,52,44,.22)}
.avatar.photo.medium{width:30px;height:30px}
.avatar.photo.large{width:80px;height:80px;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(59,52,44,.25)}
.portrait-head{display:flex;align-items:center;gap:16px;margin:4px 0 8px}
.portrait-head h2{margin:2px 0 2px}
.meme-caption{font-size:12.5px;font-style:italic;color:var(--coral-dark);font-weight:500;letter-spacing:.01em}
.name-avatar{display:flex;align-items:center;gap:10px}
.card h4{font-size:13.5px;font-weight:600;margin:5px 0 3px;line-height:1.3}
.card p{font-size:12.5px;line-height:1.45;color:#5d5348;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .buttons{display:flex;gap:6px;margin-top:8px}
.card .approve{background:var(--ink);color:#fff7ee;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px}
.card .later{font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid rgba(59,52,44,.14)}
.card.later-card{opacity:.6}
.card.approved{opacity:.7}
.card.approved .buttons{display:none}
.empty{font-size:12.5px;color:var(--muted);padding:6px 2px}
.stream-box{flex:1 1 0}
.live-badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--coral-dark)}
.stream{list-style:none;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-height:0}
.stream li{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(59,52,44,.06);animation:slide .35s ease}
@keyframes slide{from{transform:translateY(-6px)}to{transform:none}}
.stream li .avatar{margin-top:1px}
.stream li div{min-width:0}
.stream li p{font-size:13px;line-height:1.38}
.stream li small{display:block;font-size:11.5px;color:#a3978a;margin-top:2px}
.stream li.ok p{color:var(--coral-dark);font-weight:600}
.stream li.memory p{color:#8a5a14;font-weight:600}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* command */
.command{position:fixed;bottom:22px;left:calc((100% - var(--side-width) - 16px) / 2);transform:translateX(-50%);width:min(600px,calc(100% - 460px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:20px;z-index:3}
.command .ceo-icon{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--coral-dark);background:rgba(255,122,89,.12);padding:6px 8px;border-radius:8px}
.command input{flex:1;border:none;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:10px 4px;min-width:0}
.command input::placeholder{color:#a3978a}
.send{background:var(--coral);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:14px;box-shadow:0 4px 14px rgba(255,122,89,.35);transition:transform .15s,background .15s}
.send:hover{background:var(--coral-dark)}.send:active{transform:scale(.96)}
.send:disabled{opacity:.55;cursor:wait}

/* agent panel (slides over the side column) */
.panel{position:fixed;top:76px;right:16px;bottom:42px;width:var(--side-width);overflow:auto;padding:22px;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:4;background:rgba(255,250,243,.94)}
.panel.open{transform:none}
.panel .close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:10px;font-size:18px;color:var(--muted)}
.panel .close:hover{background:rgba(255,255,255,.8)}
.panel .room-label{font-size:12px;color:var(--muted);font-weight:500}
.panel h2{font-family:"Space Grotesk",sans-serif;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0 10px}
.panel h3{font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(59,52,44,.07);color:#6d6357;max-width:100%}
.status.working{background:rgba(255,122,89,.14);color:var(--coral-dark)}
.status .dot{width:7px;height:7px;background:currentColor;box-shadow:none;animation:none}
.live-list{display:flex;flex-direction:column;gap:8px}
.live-list .session{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(59,52,44,.08)}
.live-list .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.live-list .top .dot,.live-list .sub .dot{width:7px;height:7px;border-radius:50%;background:#c9bfb2;flex:none}
.live-list .working>.dot{background:#5aa36a}
.live-list small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.live-list .sub{display:flex;gap:8px;align-items:baseline;margin:8px 0 0 14px;font-size:12.5px}
.live-list .empty{font-size:12.5px;color:var(--muted)}
.rows{margin:16px 0 4px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13px;line-height:1.4}
.row span:first-child{color:var(--muted)}
.note{font-size:12px;line-height:1.45;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:10px 12px;color:#5d5348;margin-top:10px;white-space:pre-line}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.presets button{text-align:left;font-size:12.5px;font-weight:500;line-height:1.3;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);transition:background .15s,transform .15s,border-color .15s}
.presets button:hover{background:#fff;border-color:rgba(255,122,89,.45)}
.presets button:active{transform:scale(.97)}
.write{display:flex;gap:8px}
.write input{flex:1;min-width:0;border:1px solid rgba(59,52,44,.12);background:rgba(255,255,255,.75);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;outline:none;color:var(--ink)}
.write input:focus{border-color:rgba(255,122,89,.6)}
.write .send{padding:10px 14px;font-size:13px}
.agent-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.agent-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);font-size:13.5px;font-weight:500;text-align:left}
.agent-list button:hover{background:#fff}
.agent-list small{color:var(--muted);font-weight:400;font-size:12px;text-align:right}

.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:4px 0 12px}
.mini-stats div{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:9px 11px}
.mini-stats b{display:block;font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700}
.mini-stats span{font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(59,52,44,.1);color:#5d5348}
.skills{display:flex;flex-direction:column;gap:6px}
.skill{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);transition:background .15s,border-color .15s}
.skill:hover{background:#fff;border-color:rgba(255,122,89,.45)}
.skill div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:500}
.skill small{color:var(--muted);font-weight:400;font-size:11.5px;white-space:nowrap}
.skill.active{border-color:rgba(255,122,89,.6);background:#fff}
.progress-bar{height:4px;border-radius:2px;background:rgba(59,52,44,.1);margin-top:8px;overflow:hidden;position:relative}
.progress-bar i{position:absolute;top:0;bottom:0;width:30%;background:var(--coral);border-radius:2px;animation:progress 1.3s ease-in-out infinite}
@keyframes progress{from{left:-30%}to{left:100%}}
.label3d.sub{background:rgba(255,251,246,.72);border-style:dashed}
.label3d.sub .name{font-size:11px;color:#8a7f72}

/* tab pages */
.page{position:fixed;top:76px;left:22px;right:calc(var(--side-width) + 32px);bottom:42px;padding:24px 26px;overflow:auto;z-index:4;display:none;background:rgba(255,250,243,.93)}
.page.open{display:block;animation:enter .3s ease}
.page h2{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em}
.page .lede{font-size:13px;color:var(--muted);margin:4px 0 18px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid .card p{-webkit-line-clamp:4}
.grid .card ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:5px}
.grid .card li{font-size:12.5px;line-height:1.4;color:#5d5348;padding-left:10px;position:relative}
.grid .card li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--coral)}
.grid .card button.go{margin-top:8px;font-size:12px;font-weight:600;color:var(--coral-dark)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid rgba(59,52,44,.12)}
td{padding:9px 10px;border-bottom:1px solid rgba(59,52,44,.06);font-variant-numeric:tabular-nums}
td.number,th.number{text-align:right}
.summary-stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.summary-stats div{background:rgba(255,255,255,.72);border-radius:12px;padding:12px 16px;min-width:150px}
.summary-stats b{display:block;font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700}
.summary-stats span{font-size:12px;color:var(--muted)}

/* 3D attached labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.label3d{position:absolute;left:0;top:0;pointer-events:none;padding:5px 9px 6px;border-radius:9px;white-space:nowrap;will-change:transform;background:rgba(255,251,246,.9);border:1px solid rgba(59,52,44,.1);box-shadow:0 3px 12px rgba(90,70,50,.12);max-width:250px}
.label3d .name{font-size:12px;font-weight:700;color:var(--ink);line-height:1.2}
.label3d .badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:#2f2a25;color:#fff4e8;font-size:10px;font-weight:600;line-height:16px;vertical-align:1px}
.label3d .what{font-size:11.5px;font-weight:500;color:#958a7d;line-height:1.25;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.label3d.working{background:#fff;border-color:rgba(255,122,89,.65);box-shadow:0 4px 16px rgba(255,122,89,.25)}
.label3d.working .what{color:var(--coral-dark);font-weight:600}

const ROOM_W = 10.4, ROOM_D = 8.4, DESK_SPACING = 2.4, SIDE_PADDING = 2.8, ROW_SPACING = 3.1, CORRIDOR = 1.6;
const THEMES = {
  writing:{ rug1:'#c95c45', rug2:'#f6c35c', name:'Writing Room', floor:'#fbe0d4', wall:'#f2876b', description:'Blog posts, newsletters and drafts. Publishing is your job; the agent stops at the draft.' },

// cream-pastel sets for an unknown room id: [rug1, rug2, floor, wall]
const PALETTE = [['#c97a45', '#7fc8a9', '#fbe6d2', '#f0a878'], ['#4f8f8a', '#f2c14e', '#dff0ec', '#86c2b8'], ['#a0567a', '#f6c35c', '#f6e0ea', '#d996b6'],

async function getJSON(path) {

// For memory-heavy situations such as screen recording: default 1.5x; ?light=1 → 1x, small shadow map, no antialias.
const LIGHT = new URLSearchParams(location.search).has('light');
const renderer = new THREE.WebGLRenderer({ canvas:canvasEl, antialias:!LIGHT, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, LIGHT ? 1 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
// background: a soft peach → cream gradient
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#ffd9bf'); g.addColorStop(.55, '#fbe9d6'); g.addColorStop(1, '#f6efe2');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog('#f8e4d0', 95, 170);

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 1, 400);
const OVERVIEW = { position:new THREE.Vector3(36.5, 52.5, 65.5), target:new THREE.Vector3(.6, 0, 3.4) };
camera.position.copy(OVERVIEW.position);
function setView() {
  // center the scene in the gap between the side column and the greeting card
  camera.aspect = innerWidth / innerHeight;
  camera.setViewOffset(innerWidth, innerHeight, Math.round(innerWidth * .085), -Math.round(innerHeight * .015), innerWidth, innerHeight);
  camera.updateProjectionMatrix();
}
setView();

const controls = new OrbitControls(camera, canvasEl);
controls.target.copy(OVERVIEW.target);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minPolarAngle = .45; controls.maxPolarAngle = 1.05;
controls.minDistance = 14; controls.maxDistance = 100;
controls.screenSpacePanning = false;
const BOUNDS = { x0:-24, x1:24, z0:-16, z1:16 };   // updated from the plinth once the layout is built
controls.addEventListener('change', () => {
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, BOUNDS.x0, BOUNDS.x1);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, BOUNDS.z0, BOUNDS.z1);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 2);
});

// warm golden hour: a strong directional sun, less fill → contrasty shadows
scene.add(new THREE.HemisphereLight('#fff1df', '#d9b08a', 1.05));
const sun = new THREE.DirectionalLight('#ffd29a', 3.4);
sun.position.set(-22, 40, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(LIGHT ? 1024 : 2048, LIGHT ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left:-32, right:32, top:26, bottom:-26, near:5, far:110 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03; sun.shadow.radius = 4;
scene.add(sun);
const fillLight = new THREE.DirectionalLight('#d6e2ff', .35); fillLight.position.set(30, 18, -10); scene.add(fillLight);

/* ---------- helpers ---------- */
const materials = new Map();
const mat = (color, extra = {}) => {
  const k = color + JSON.stringify(extra);
  if (!materials.has(k)) materials.set(k, new THREE.MeshStandardMaterial({ color, roughness:.86, metalness:0, ...extra }));
  return materials.get(k);
};
const geometryCache = new Map();
const rounded = (w, h, d, r = .06, seg = 2) => {
  const k = [w, h, d, r, seg].join('|');
  if (!geometryCache.has(k)) geometryCache.set(k, new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001)));
  return geometryCache.get(k);
};
function box(parent, w, h, d, color, x, y, z, r = .06, shadow = true) {
  const m = new THREE.Mesh(rounded(w, h, d, r), typeof color === 'string' ? mat(color) : color);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function canvasTexture(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return { canvas:c, ctx:c.getContext('2d'), texture:t };
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ellipsize(ctx, s, w) { if (ctx.measureText(s).width <= w) return s; while (s.length > 2 && ctx.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; }

const shadowTexture = (() => {
  const { ctx, texture } = canvasTexture(128, 128);
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, 'rgba(70,50,30,.42)'); g.addColorStop(1, 'rgba(70,50,30,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128); texture.needsUpdate = true; return texture;
})();
function aoPatch(parent, w, d, x, z, y = .115, strength = 1) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map:shadowTexture, transparent:true, depthWrite:false, opacity:strength }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); parent.add(m); return m;
}

await Promise.race([
  Promise.all([document.fonts.load('600 40px "Space Grotesk"'), document.fonts.load('500 20px Inter'), document.fonts.load('600 20px Inter')]),
  new Promise(r => setTimeout(r, 1800)),
]).catch(() => {});

/* ---------- load the agent list (the scene is built from it) ---------- */
let demoData = null;
async function loadAgentsPayload() {
  if (DEMO) { demoData = await getJSON('demo-data.json'); return demoData; }
  return getJSON('/api/agents');
}
let apiAgents = [], apiRooms = [], apiSettings = {};
try {
  const v = await loadAgentsPayload();
  apiAgents = Array.isArray(v.agents) ? v.agents : [];
  apiRooms = Array.isArray(v.rooms) ? v.rooms : [];
  apiSettings = v.settings && typeof v.settings === 'object' ? v.settings : {};
} catch { apiAgents = []; }
// rooms: the order of the `rooms` list + ids seen on agents but missing from it; only rooms with agents are built (the CEO always is).
// An agent with a missing/invalid room sits in "general". A config name/description/note overrides the theme.
const seated = apiAgents.filter(a => a && typeof a.id === 'string').map(a => ({ ...a, room:isValidRoomId(a.room) ? a.room : 'general' }));
// Rooms you configured are built even when nobody sits in them yet: an empty room is part of the office.
ROOMS = [...new Set(['ceo', ...apiRooms.map(r => r?.id), ...seated.map(a => a.room)])]
  .filter(id => isValidRoomId(id))
  .map(id => {
    const room = { id, ...roomTheme(id) }, c = apiRooms.find(x => x?.id === id);
    if (c) ['name', 'description', 'note'].forEach(k => { if (typeof c[k] === 'string') room[k] = c[k].slice(0, k === 'name' ? 40 : 600); });
    roomSize(room, seated); return room;
  });
// Rooms tab: every configured room, including the empty ones (an empty room is not built on the scene).
const CONFIGURED_ROOMS = [...new Set(['ceo', ...apiRooms.map(r => r?.id), ...seated.map(a => a.room)])]
  .filter(isValidRoomId)
  .map(id => {
    const theme = roomTheme(id), c = apiRooms.find(x => x?.id === id);
    return { id, name:(c && c.name) || theme.name, description:(c && c.description) || theme.description };
  });
setupLayout(ROOMS);
AGENTS = seated.map(a => ({ ...a, ...computePlacement(a, seated) }));
const USER_NAME = String(apiSettings.user || '').slice(0, 40);
const BRAND = String(apiSettings.brand || 'MyOffice').slice(0, 40);
const YOU = USER_NAME || 'You';
document.title = BRAND; $('brand').textContent = BRAND;

/* ---------- model plinth + camera/light from the layout box (11 rooms = 50×36 plinth, scale 1) ---------- */
const BOX = ROOMS.reduce((k, r) => ({ x0:Math.min(k.x0, r.cx - r.w / 2), x1:Math.max(k.x1, r.cx + r.w / 2), z0:Math.min(k.z0, r.cz - r.d / 2), z1:Math.max(k.z1, r.cz + r.d / 2) }), { x0:Infinity, x1:-Infinity, z0:Infinity, z1:-Infinity });
const CENTER = new THREE.Vector3((BOX.x0 + BOX.x1) / 2, 0, (BOX.z0 + BOX.z1) / 2);
const PLINTH_W = BOX.x1 - BOX.x0 + 6.6, PLINTH_D = BOX.z1 - BOX.z0 + 7.6;
const SCALE = Math.max(.62, PLINTH_W / 50, PLINTH_D / 46), BIG = Math.max(1, SCALE);   // depth foreshortens at a slant
box(scene, PLINTH_W, 1.4, PLINTH_D, '#e5d9c4', CENTER.x, -.7, CENTER.z, .35, false).receiveShadow = true;
box(scene, PLINTH_W + 1.2, .5, PLINTH_D + 1.2, '#d8c9b1', CENTER.x, -1.55, CENTER.z, .2, false);
aoPatch(scene, PLINTH_W * 1.56, PLINTH_D * 1.61, CENTER.x + 1, CENTER.z + 3, -1.79, .8);
const groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(400 * BIG, 400 * BIG), new THREE.MeshStandardMaterial({ color:'#ebe2d3', roughness:1 }));
groundPlane.rotation.x = -Math.PI / 2; groundPlane.position.set(CENTER.x, -1.8, CENTER.z); groundPlane.receiveShadow = true; scene.add(groundPlane);
OVERVIEW.target.copy(CENTER).add(new THREE.Vector3(.6, 0, 3.4).multiplyScalar(SCALE));
OVERVIEW.position.copy(OVERVIEW.target).add(new THREE.Vector3(32.4, 47.4, 56.1).multiplyScalar(SCALE));
camera.position.copy(OVERVIEW.position); controls.target.copy(OVERVIEW.target);
camera.far = 400 * BIG; setView();
controls.maxDistance = 100 * BIG;
BOUNDS.x0 = CENTER.x - PLINTH_W / 2 + 1; BOUNDS.x1 = CENTER.x + PLINTH_W / 2 - 1; BOUNDS.z0 = CENTER.z - PLINTH_D / 2 + 2; BOUNDS.z1 = CENTER.z + PLINTH_D / 2 - 2;
scene.fog.near = 95 * BIG; scene.fog.far = 170 * BIG;
sun.position.copy(CENTER).add(new THREE.Vector3(-22, 40, 24).multiplyScalar(BIG));
sun.target.position.copy(CENTER); scene.add(sun.target);
const shadowK = Math.max(.6, SCALE);
Object.assign(sun.shadow.camera, { left:-32 * shadowK, right:32 * shadowK, top:26 * shadowK, bottom:-26 * shadowK, far:110 * BIG });
sun.shadow.camera.updateProjectionMatrix();

/* ---------- rooms ---------- */
const pickables = [];
function roomSubtitle(room) {
  const n = AGENTS.filter(a => a.room === room.id).length;
  if (room.id === 'ceo') return 'You only talk to the CEO';
  return plural(n, 'agent') + ' · ' + (AGENTS.find(a => a.room === room.id)?.trigger_label || 'when work arrives');
}
function drawFloorLabel(room) {
  const { ctx, texture } = room.floorTexture;
  const n = AGENTS.filter(a => a.room === room.id).length;
  const m = AGENTS.filter(a => a.room === room.id && a.status && a.status !== 'sleeping' && a.status !== 'done').length;
  const key = n + '|' + m; if (room.floorKey === key) return; room.floorKey = key;
  ctx.clearRect(0, 0, 1024, 160);
  ctx.fillStyle = 'rgba(59,52,44,.82)';
  ctx.font = '600 60px "Space Grotesk"';
  ctx.letterSpacing = '4px';
  ctx.fillText(room.name.toLocaleUpperCase('en-US'), 8, 68);
  ctx.letterSpacing = '0px';
  // badge: N agents · M working
  const label = room.id === 'ceo' ? 'You only talk to the CEO' : plural(n, 'agent') + ' · ' + m + ' working';
  ctx.font = '600 32px Inter';
  const w = ctx.measureText(label).width + 44;
  ctx.fillStyle = m ? 'rgba(255,122,89,.9)' : 'rgba(255,255,255,.75)';
  roundRect(ctx, 8, 92, w, 52, 26); ctx.fill();
  ctx.fillStyle = m ? '#fff' : (room.gold ? 'rgba(150,108,24,.95)' : 'rgba(110,98,84,.95)');
  ctx.fillText(label, 30, 129);
  texture.needsUpdate = true;
}
function floorLabel(room, g) {
  room.floorTexture = canvasTexture(1024, 160);
  const { texture } = room.floorTexture;
  drawFloorLabel(room);
  const width = Math.min(room.w - 1.2, 9.2);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 160 / 1024), new THREE.MeshBasicMaterial({ map:texture, transparent:true, depthWrite:false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(-room.w / 2 + .6 + width / 2, .125, room.d / 2 - .85);
  g.add(m);
}
function buildRoom(room) {
  const g = new THREE.Group(); g.position.set(room.cx, 0, room.cz); scene.add(g); room.group = g;
  const floorMaterial = new THREE.MeshStandardMaterial({ color:room.floor, roughness:.92, emissive:'#ff7a59', emissiveIntensity:0 });
  const floorMesh = new THREE.Mesh(rounded(room.w, .2, room.d, .08), floorMaterial);
  floorMesh.position.y = .01; floorMesh.receiveShadow = true; floorMesh.userData.room = room.id; g.add(floorMesh);
  room.floorMesh = floorMesh; pickables.push(floorMesh);
  if (room.glass) buildGlassRoom(room, g); else buildWalls(room, g);
  floorLabel(room, g);
  room.decorStart = g.children.length;   // everything after this is a prop: in a wide room it slides to the edge
}
function buildWalls(room, g) {
  const H = 2.6, T = .24;
  box(g, room.w, H, T, room.wall, 0, H / 2 + .1, -room.d / 2 + T / 2, .07);
  box(g, T, H, room.d - T, room.wall, -room.w / 2 + T / 2, H / 2 + .1, T / 2, .07);
  if (room.door) {
    // door gap in the front wall: 2 units open at the right end, a coral line on the threshold
    box(g, room.w - 2.6, .26, T, room.wall, -1.3, .23, room.d / 2 - T / 2, .06);
    box(g, 2.2, .04, .22, mat('#ff7a59', { emissive:'#ff7a59', emissiveIntensity:.25 }), room.w / 2 - 1.4, .14, room.d / 2 - T / 2, .02, false);
  } else box(g, room.w, .26, T, room.wall, 0, .23, room.d / 2 - T / 2, .06);
  box(g, T, .26, room.d - T, room.wall, room.w / 2 - T / 2, .23, T / 2, .06);
  aoPatch(g, room.w, 1.6, 0, -room.d / 2 + .7, .118, .55);
  if (room.gold) {
    const gold = mat('#d6ad52', { metalness:.65, roughness:.32 });
    box(g, room.w, .1, T + .04, gold, 0, H + .14, -room.d / 2 + T / 2, .03);
    box(g, T + .04, .1, room.d - T, gold, -room.w / 2 + T / 2, H + .14, T / 2, .03);
    const rugMesh = new THREE.Mesh(rounded(room.w - 4, .03, 3.2, .015), mat('#ead7a6'));
    rugMesh.position.set(0, .125, .9); rugMesh.receiveShadow = true; g.add(rugMesh);
  }
}
function buildGlassRoom(room, g) {
  const glass = new THREE.MeshStandardMaterial({ color:'#dff0f2', transparent:true, opacity:.22, roughness:.08, metalness:.1, depthWrite:false });
  const frame = mat('#c9bfb1');
  const H = 2.3;
  [[0, -room.d / 2, room.w, .08], [0, room.d / 2, room.w, .08]].forEach(([x, z, w, d]) => {
    const m = new THREE.Mesh(rounded(w, H, d, .03), glass); m.position.set(x, H / 2 + .1, z); m.renderOrder = 2; g.add(m);
    box(g, w, .08, .14, frame, x, H + .12, z, .03);
  });
  [[-room.w / 2, 0], [room.w / 2, 0]].forEach(([x, z]) => {
    const m = new THREE.Mesh(rounded(.08, H, room.d, .03), glass); m.position.set(x, H / 2 + .1, z); m.renderOrder = 2; g.add(m);
    box(g, .14, .08, room.d, frame, x, H + .12, z, .03);
  });
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => box(g, .16, H + .1, .16, frame, sx * room.w / 2, H / 2 + .12, sz * room.d / 2, .04));
  box(g, 2.2, .04, .2, mat('#ff7a59', { emissive:'#ff7a59', emissiveIntensity:.25 }), 0, .14, room.d / 2, .02, false);
}
ROOMS.forEach(buildRoom);
setupDecor(ROOMS);

/* ---------- decor ---------- */
function plant(g, x, z, s = 1) {
  box(g, .5 * s, .5 * s, .5 * s, '#d9c3a5', x, .37 * s, z, .1);
  const leaf = mat('#9db58a', { flatShading:true, roughness:.9 });
  [[0, .95, 0, .42], [.15, 1.25, .05, .3], [-.12, 1.15, -.08, .32]].forEach(([dx, y, dz, r]) => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 0), leaf);
    m.position.set(x + dx * s, y * s, z + dz * s); m.castShadow = true; g.add(m);
  });
  aoPatch(g, 1.2 * s, 1.2 * s, x, z);
}
function shelf(g, x, z, w = 2.2, colors = ['#e7a58d', '#a9c1d6', '#d9c27a', '#b9cfb0', '#cdb8dc']) {
  box(g, w, 1.9, .5, '#e9e1d4', x, 1.05, z, .05);
  for (let s = 0; s < 3; s++) {
    let px = x - w / 2 + .2;
    for (let i = 0; i < 7 && px < x + w / 2 - .3; i++) {
      const bw = .14 + ((i * 7 + s * 3) % 4) * .03, bh = .38 + ((i * 5 + s) % 3) * .06;
      box(g, bw, bh, .32, colors[(i + s) % colors.length], px + bw / 2, .42 + s * .58 + bh / 2, z + .06, .02, false);
      px += bw + .03;
    }
  }
}
function singleDesk(g, x, z, w = 1.6) {
  box(g, w, .08, .9, '#f3ece2', x, .82, z, .03);
  box(g, .08, .72, .8, '#d8cdbd', x - w / 2 + .1, .44, z, .03);
  box(g, .08, .72, .8, '#d8cdbd', x + w / 2 - .1, .44, z, .03);
}
/* LED racks (data + maintenance) */
const ledTexture = canvasTexture(64, 160);
function drawLed(t) {
  const { ctx } = ledTexture;
  ctx.fillStyle = '#3a3f42'; ctx.fillRect(0, 0, 64, 160);
  for (let r = 0; r < 10; r++) {
    ctx.fillStyle = '#2c3033'; ctx.fillRect(4, 4 + r * 15.5, 56, 12);
    for (let i = 0; i < 4; i++) {
      const s = Math.sin(t * (2 + i) + r * 1.7 + i * 3.1);
      ctx.fillStyle = s > .55 ? '#ff8a66' : s > -.2 ? '#9fd8b0' : '#4b5154';
      ctx.fillRect(9 + i * 7, 8 + r * 15.5, 4, 4);
    }
    ctx.fillStyle = '#4b5154'; ctx.fillRect(40, 8 + r * 15.5, 16, 4);
  }
  ledTexture.texture.needsUpdate = true;
}
drawLed(0);
function serverShelf(g, x, zList, color = '#4a4f53') {
  zList.forEach(z => {
    box(g, .95, 2.3, 1.1, color, x, 1.28, z, .05);
    const front = new THREE.Mesh(new THREE.PlaneGeometry(.95, 2.1), new THREE.MeshBasicMaterial({ map:ledTexture.texture }));
    front.rotation.y = Math.PI / 2; front.position.set(x + .49, 1.28, z); front.scale.set(1.04, 1, 1); g.add(front);
    aoPatch(g, 1.8, 1.8, x + .05, z, .118, .8);
  });
}
// furniture of the ready-made themed rooms (sized for the 10.4×8.4 base room; skipped when there is no such room)
const THEME_DECOR = {
  writing:g => { plant(g, 4.2, 2.6); shelf(g, -3.6, -3.3, 2.0); box(g, 1.2, .9, .9, '#e5a089', 4.0, .55, -2.8, .2); },
  code:g => plant(g, -4.2, 2.6),
  design:g => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.55, .06, 10, 40), mat('#fff5e8', { emissive:'#fff1dc', emissiveIntensity:.6 }));
    ring.position.set(3.6, 1.9, .6); ring.rotation.y = -.6; ring.castShadow = true; g.add(ring);
    box(g, .05, 1.4, .05, '#8d8276', 3.6, 1.0, .6, .02); box(g, .7, .04, .7, '#8d8276', 3.6, .14, .6, .02);
    plant(g, -4.2, 2.6);
  },
  social:g => { shelf(g, -3.3, -3.3, 2.4); plant(g, 4.2, 2.6); },
  research:g => {
    const globe = new THREE.Mesh(new THREE.IcosahedronGeometry(.42, 1), mat('#a9c6d8', { flatShading:true }));
    globe.position.set(3.4, 1.35, -2.2); globe.castShadow = true; g.add(globe);
    box(g, .9, .82, .9, '#e9e1d4', 3.4, .51, -2.2, .1);

  },
  'end-of-day':g => {

    moon.position.set(3.5, 1.2, -2.6); g.add(moon); box(g, .8, .8, .8, '#d5cce5', 3.5, .5, -2.6, .1);
    plant(g, -4, 2.5);
  },
  ceo:g => { box(g, 3.2, .5, 1.1, '#e3b9a6', -8.4, .45, 1.9, .2); box(g, 3.2, .7, .3, '#e3b9a6', -8.4, .8, 2.35, .14); plant(g, -9.3, -3, 1.1); plant(g, 9.3, -3, 1.1); },
  workshop:g => {
    shelf(g, -3.4, -3.3, 2.2, ['#d6ad52', '#e7a58d', '#cdb8dc', '#a9c1d6']);
    const mug = new THREE.Mesh(new THREE.CylinderGeometry(.22, .1, .4, 18), mat('#d6ad52', { metalness:.7, roughness:.28 }));
    mug.position.set(-3.4, 2.25, -3.3); mug.castShadow = true; g.add(mug);
    plant(g, 4.2, 2.6); box(g, 1.4, .9, .9, '#ecd59a', 3.6, .55, -2.8, .15);
  },
  mail:g => {
    [0, 1, 2].forEach(i => box(g, 1, .12, .7, i === 0 ? '#ff9b7e' : '#efe4d6', 3.6, .95 + i * .2, -2.6, .03));
    box(g, 1.1, .82, .8, '#e3c5c4', 3.6, .5, -2.6, .1); plant(g, -4.2, 2.6);
  },
  // data: server racks + cable
  data:g => { serverShelf(g, -4.35, [-2.4, -1.15, .1, 1.35]); box(g, .18, .06, 5, '#ff7a59', -3.6, .13, -.5, .02, false); },
  // maintenance: disk rack (left wall) + door lights

  const trim = (x, suffix) => x.toFixed(1).replace(/\.0$/, '') + suffix;
  if (n < 1000) return String(n);
  if (n < 999950) return trim(n / 1000, 'k');
  return trim(n / 1e6, 'M');
}
function agentDayToApi(agentDay) {          // {office:{4 fields}, terminal:{4 fields}} from an event → API shape
  const o = agentDay?.office || {}, t = agentDay?.terminal || {};
  const num = (u, k) => Number(u[k]) || 0, sum = u => TOKEN_FIELDS.reduce((s, k) => s + num(u, k), 0);
  const total = k => num(o, k) + num(t, k);
  return { total:sum(o) + sum(t), input:total('input_tokens'), output:total('output_tokens'), cache_write:total('cache_creation_input_tokens'),
    cache_read:total('cache_read_input_tokens'), office_total:sum(o), terminal_total:sum(t) };
}

/* ---------- work envelope ---------- */
const envelopes = [];
const envelopeGeo = rounded(.5, .1, .34, .03);

  const start = new THREE.Vector3(ceo.group.position.x, 2.4, ceo.group.position.z + .4);
  const end = new THREE.Vector3(target.group.position.x, 2.3, target.group.position.z + .2);
  const middle = start.clone().lerp(end, .5); middle.y = 7 + start.distanceTo(end) * .12;

  mesh.castShadow = true; scene.add(mesh);

  page.replaceChildren(...content); page.classList.add('open');
}
function settingsPage() {
  const holder = el('div');
  renderSettings(holder);
  return [holder];
}
function roomsPage() {
  const grid = el('div', 'grid');
  CONFIGURED_ROOMS.forEach(cfg => {
    const r = ROOMS.find(x => x.id === cfg.id);
    const card = el('div', 'card');
    const ul = el('ul');
    const members = AGENTS.filter(a => a.room === cfg.id);
    members.forEach(a => ul.append(el('li', null, a.name + ' · ' + statusText(a))));
    if (!members.length) ul.append(el('li', null, 'empty · no agent sits here yet'));
    card.append(el('h4', null, cfg.name), el('p', null, cfg.description), ul);
    if (r && members.length) {
      const go = el('button', 'go', 'Go to room →');

      card.append(go);
    } else if (r) {
      const go = el('button', 'go', 'Go to room →');
      go.onclick = () => { SOUND.click(); openTab('office'); highlightRoom(r.id); goRoom(r); };
      card.append(go);
    } else {

    }
    grid.append(card);
  });
  return [el('h2', null, 'Rooms'), el('p', 'lede', plural(CONFIGURED_ROOMS.length, 'room') + ', ' + plural(AGENTS.length, 'agent') + '. Every room wakes up when work arrives.'), grid];
}
async function memoryPage() {
  let list = [];
  try { list = DEMO ? demoData.memory : (await getJSON('/api/memory')).memory; }
  catch { return [el('h2', null, 'Memory'), el('p', 'lede', 'Memory list could not be loaded.')]; }
  const sorted = [...list].sort((x, y) => String(y.updated).localeCompare(String(x.updated)));

  sorted.forEach(m => {
    const card = el('div', 'card');
    const top = el('div', 'top'); top.append(avatarNode(m.agent), document.createTextNode('memory/' + m.agent + '.md · ' + plural(m.entry_count, 'entry')));
    const ul = el('ul'); (m.latest_entries || []).slice().reverse().forEach(e => ul.append(el('li', null, truncate(e, 160))));
    if (!(m.latest_entries || []).length) ul.append(el('li', null, 'no entries yet'));

}
function costPage() {
  const runs = counter.runs || [];
  const tokens = u => u ? (u.input_tokens || 0) + (u.output_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0) : null;
  const summary = el('div', 'summary-stats');
  [[counter.runs_today ?? 0, 'agent runs today'], [counter.ceo_today ?? 0, 'CEO decisions'], ['0', 'tokens spent while idle'], ['$' + Number(counter.total_cost_usd || 0).toFixed(2), 'measured (API list price)']]
    .forEach(([b, s]) => { const d = el('div'); d.append(el('b', null, String(b)), el('span', null, s)); summary.append(d); });
  const table = el('table'); const head = el('tr');
  [['Time'], ['Agent'], ['Status'], ['Duration', 1], ['Tokens', 1], ['USD', 1]].forEach(([t, num]) => head.append(el('th', num ? 'number' : '', t)));
  table.append(head);
  [...runs].reverse().forEach(r => {
    const tr = el('tr');
    const clock = /-(\d{2})(\d{2})\d{2}-/.exec(r.run_id || '');
    [[clock ? clock[1] + ':' + clock[2] : '—'], [findAgent(r.agent)?.name || r.agent], [r.status === 'success' ? 'done' : r.status || '—'],
      [r.duration_s != null ? Math.round(r.duration_s) + 's' : '—', 1], [tokens(r.usage)?.toLocaleString('en-US') ?? '—', 1],
      [typeof r.cost_usd === 'number' ? r.cost_usd.toFixed(3) : '—', 1]].forEach(([v, num]) => tr.append(el('td', num ? 'number' : '', v)));
    table.append(tr);
  });
  if (!runs.length) { const tr = el('tr'); const td = el('td', null, 'No runs yet today.'); td.colSpan = 6; tr.append(td); table.append(tr); }
  return [el('h2', null, 'Cost'), el('p', 'lede', counter.cost_note || 'Agents only run when work arrives; no model calls while idle.'), summary, table];
}
document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => { SOUND.click(); openTab(b.dataset.tab); }; b.onmouseenter = () => SOUND.hover(); });

/* ---------- camera ---------- */
let camTransition = null;
function goCamera(position, target, duration = 1.15, instant = false) {
  if (instant) { camera.position.copy(position); controls.target.copy(target); controls.update(); return; }
  camTransition = { p0:camera.position.clone(), t0:controls.target.clone(), p1:position.clone(), t1:target.clone(), t:0, duration };
}
function goRoom(room, instant = false) {
  const target = new THREE.Vector3(room.cx, .8, room.cz + .3);
  const k = Math.max(1, room.w / 14.5, room.d / 8.4);
  goCamera(target.clone().add(new THREE.Vector3(10 * k, 16 * k, 20 * k)), target, 1.15, instant);
}
function updateCamera(dt) {
  if (!camTransition) return;
  camTransition.t = Math.min(1, camTransition.t + dt / camTransition.duration);
  const t = camTransition.t, k = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  camera.position.lerpVectors(camTransition.p0, camTransition.p1, k);
  controls.target.lerpVectors(camTransition.t0, camTransition.t1, k);
  if (t >= 1) camTransition = null;
}
$('overview').onclick = () => { SOUND.click(); closePanel(); openTab('office'); goCamera(OVERVIEW.position, OVERVIEW.target); };
$('overview').onmouseenter = () => SOUND.hover();

/* ---------- cat memes (played on click) ---------- */
const meme = setupMeme({ goCamera, controls, cancel:a => goRoom(findRoom(a.room)) });

/* ---------- selection / hover ---------- */
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let hovered = null, selectedRoom = null, pressPoint = null;
function highlightRoom(id) { selectedRoom = id; ROOMS.forEach(r => { r.floorMesh.material.emissiveIntensity = r.id === selectedRoom ? .12 : r.id === hovered?.room ? .06 : 0; }); }
function pickAt(e) {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const agentHit = hits.find(h => h.object.userData.agent);
  if (agentHit) { const a = findAgent(agentHit.object.userData.agent); return { agent:a.id, room:a.room }; }
  return hits[0] ? { room:hits[0].object.userData.room } : null;
}
canvasEl.addEventListener('pointermove', e => {
  const h = pickAt(e);
  const key = h ? (h.agent || h.room) : null, previous = hovered ? (hovered.agent || hovered.room) : null;
  if (key !== previous) { hovered = h; if (h) SOUND.hover(); highlightRoom(selectedRoom); canvasEl.style.cursor = h ? 'pointer' : 'default'; }
});
canvasEl.addEventListener('pointerdown', e => { pressPoint = [e.clientX, e.clientY]; });
canvasEl.addEventListener('pointerup', e => {
  if (!pressPoint || Math.hypot(e.clientX - pressPoint[0], e.clientY - pressPoint[1]) > 5) return;
  const h = pickAt(e);
  if (meme.active()) { const previous = meme.close(); if (!h) { if (previous) goRoom(findRoom(previous.room)); return; } }
  if (!h) return;
  SOUND.click();
  const room = findRoom(h.room);
  highlightRoom(room.id);
  if (h.agent) {
    // the cat's meme first, then the panel
    const a = findAgent(h.agent);
    const open = () => { goRoom(room); agentPanel(a); };
    if (!meme.play(a, { onDone:open })) open();
  } else { goRoom(room); roomPanel(room); }
});
$('command').addEventListener('submit', e => { e.preventDefault(); const i = $('commandInput'); askCeo(i.value); i.value = ''; });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') {
    e.preventDefault();
    openTab('office');
    $('commandInput').focus();
  }
});

/* ---------- persistent agent labels (collision-free) ---------- */
const labelRoot = $('labels');
const labels = new Map();
function labelFor(a) {
  if (!labels.has(a.id)) {
    const d = el('div', 'label3d'); const name = el('div', 'name', a.name); const what = el('div', 'what'); const stem = el('div', 'stem'); const bubble = el('div', 'bubble');
    const badge = el('span', 'badge'); badge.style.display = 'none'; name.append(badge);
    const tokens = el('div', 'tokens'); tokens.style.display = 'none';
    bubble.style.display = 'none'; d.append(name, what, tokens, bubble, stem); labelRoot.append(d);
    labels.set(a.id, { d, what, tokens, stem, bubble, badge, badgeText:'', text:'', tokensText:'', cls:'', bubbleText:null, w:0, h:0 });
  }
  return labels.get(a.id);
}
function labelText(a) {
  if (a.sub) return ['sub working', a.action];
  if (a.status === 'sleeping') return ['sleeping', sleepText(a)];
  if (a.status === 'done') return ['done', '✓ done · ' + (a.lastDuration ?? '?') + 's'];
  if (a.status === 'waiting') return ['working', 'work on the way…'];
  if (a.status === 'thinking') return ['working', 'thinking…'];
  return ['working', a.action || 'working'];
}
const tmpV = new THREE.Vector3();
function updateLabels() {
  const items = [];
  [...AGENTS, ...subAgents].forEach(a => {
    const e = labelFor(a);
    const [cls, text] = labelText(a);
    const bubbleText = a.bubble && Date.now() < a.bubbleUntil ? a.bubble : null;
    let changed = false;
    if (e.text !== text) { e.what.textContent = text; e.text = text; changed = true; }
    const badgeText = !a.sub && a.terminal && a.terminalCount > 1 ? a.terminalCount + ' terminals' : '';
    if (e.badge && e.badgeText !== badgeText) { e.badge.textContent = badgeText; e.badge.style.display = badgeText ? '' : 'none'; e.badgeText = badgeText; changed = true; }
    const tokensText = !a.sub && cls !== 'sleeping' && agentTokens(a.id).total ? shortNumber(agentTokens(a.id).total) + ' tokens' : '';
    if (e.tokens && e.tokensText !== tokensText) { e.tokens.textContent = tokensText; e.tokens.style.display = tokensText ? '' : 'none'; e.tokensText = tokensText; changed = true; }
    if (e.cls !== cls) { e.d.className = 'label3d ' + cls; e.cls = cls; changed = true; }
    if (e.bubbleText !== bubbleText) { e.bubble.textContent = bubbleText || ''; e.bubble.style.display = bubbleText ? 'block' : 'none'; e.bubbleText = bubbleText; changed = true; }
    if (changed || !e.w) { e.w = e.d.offsetWidth; e.h = e.d.offsetHeight; }
    tmpV.set(0, a.sub ? .1 : 2.2, 0); a.group.localToWorld(tmpV); tmpV.project(camera);
    const x = (tmpV.x * .5 + .5) * innerWidth, y = (-tmpV.y * .5 + .5) * innerHeight;
    items.push({ e, x, y, sub:!!a.sub, priority:a.sub ? -1 : cls === 'sleeping' ? 0 : 1 });
  });
  // working labels place first, then the ones in front; an overlapping label slides to a nearby free spot (above / beside)
  items.sort((p, q) => q.priority - p.priority || q.y - p.y);
  const placed = [];
  const overlaps = (left, top, w, h) => placed.some(r => left < r.left + r.w + 4 && left + w + 4 > r.left && top < r.top + r.h + 3 && top + h + 3 > r.top);
  items.forEach(o => {
    const { w, h } = o.e;
    const below = o.sub;
    const left0 = o.x - w / 2, top0 = below ? o.y + 4 : o.y - h - 6;
    const step = (below ? 1 : -1) * (h + 4);
    let choice = null;
    for (const [dx, dy] of CANDIDATES) {
      const left = left0 + dx * w, top = top0 + dy * step;
      if (!overlaps(left, top, w, h)) { choice = [left, top, dx]; break; }
    }
    if (!choice) { let top = top0; for (let i = 0; i < 8 && overlaps(left0, top, w, h); i++) top += step; choice = [left0, top, 0]; }
    const [left, top, dx] = choice;
    placed.push({ left, top, w, h });
    o.e.d.style.transform = `translate(${left.toFixed(1)}px,${top.toFixed(1)}px)`;
    o.e.stem.style.height = (!below && dx === 0 ? Math.max(0, o.y - 6 - (top + h)) : 0).toFixed(1) + 'px';
  });
}
// candidate spots: [horizontal shift (width ratio), vertical step] sorted by cost
const CANDIDATES = [[0, 0], [0, 1], [.58, 0], [-.58, 0], [.58, 1], [-.58, 1], [0, 2], [1.08, 0], [-1.08, 0], [1.08, 1], [-1.08, 1], [0, 3]];
const roomNames = ROOMS.map(r => {
  const d = el('div', 'room-name', r.name.toLocaleUpperCase('en-US'));
  d.append(el('small', null, roomSubtitle(r))); labelRoot.append(d);
  return { r, d, p:new THREE.Vector3(r.cx - r.w / 2 + .4, r.glass ? 2.7 : 3.05, r.cz - r.d / 2 + .1) };
});
function updateRoomNames() {
  roomNames.forEach(({ r, d, p }) => {
    const show = r.id === hovered?.room && !hovered?.agent;
    d.style.display = show ? 'block' : 'none';
    if (!show) return;
    tmpV.copy(p).project(camera);
    const x = (tmpV.x * .5 + .5) * innerWidth, y = (-tmpV.y * .5 + .5) * innerHeight;
    d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(0,-100%)`;
  });
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let ledTime = 0, panelTime = 0, lineTime = 0;
function animateAgent(a, t, dt) {
  const asleep = a.status === 'sleeping' || a.status === 'waiting';
  a.cat.setStatus(asleep ? 'sleeping' : a.status === 'done' || a.status === 'thinking' ? a.status : 'working');
  a.cat.update(dt);
  a.lamp.material.color.set(asleep ? '#b9ad9e' : '#ff7a59');
  a.zSprites.forEach((s, i) => {
    if (a.status !== 'sleeping' || a.memeActive) { s.visible = false; return; }
    s.visible = true;
    const p = ((t * .45 + a.phase + i / 3) % 1);
    s.position.set(-.5 + p * .35, 1.3 + p * 1.0, .9);
    s.material.opacity = Math.sin(p * Math.PI) * .85;
    s.scale.setScalar(.3 + p * .35);
  });
  if ((a.status === 'working' || a.status === 'thinking') && t - a.screenTime > .25) { a.screenTime = t; refreshScreen(a); }
}
function updateCore(t, dt) {
  core.glowLevel = Math.max(0, core.glowLevel - dt * .9);
  const pulse = core.thinking ? (Math.sin(t * 6) * .5 + .5) * .6 : 0;
  const p = core.glowLevel + pulse;
  core.crystal.rotation.y += dt * (.25 + p * 1.5);
  core.crystal.position.y = Math.sin(t * 1.2) * .06;
  core.crystalMaterial.emissiveIntensity = .35 + p * 1.4;
  core.glow.scale.setScalar(3.2 + p * 2.6);
  core.glow.material.opacity = .75 + Math.min(.25, p);
  core.light.intensity = 2 + p * 9;
  core.g.scale.setScalar(1 + p * .12);
}
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  updateCamera(dt);
  AGENTS.forEach(a => animateAgent(a, t, dt));
  updateEnvelopes(dt); updateFlows(dt); updateCore(t, dt); animateSubAgents(t, dt);
  if (t - ledTime > .16) { ledTime = t; drawLed(t); }
  if (t - lineTime > 1.7) {
    // light keeps flowing along the line to a working room
    lineTime = t;
    new Set(AGENTS.filter(a => a.status === 'working').map(a => a.room)).forEach(id => sendLight(id));
  }
  sideDesks.forEach(m => { if (t - m.time > .5) { m.time = t; drawSubDesk(m); m.screen.texture.needsUpdate = true; } });
  if (t - panelTime > .5) { panelTime = t; if (panelAgent && findAgent(panelAgent)?.status !== 'sleeping') refreshPanel(); }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  updateRoomNames();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); setView(); });

/* ---------- boot ---------- */
drawCards();
if (DEMO) { showMode('demo', 'Demo · backend offline'); demo.start(); updateTopbar(); }
else if (!apiAgents.length) { showMode('disconnected', 'No server · try ?demo=1'); toast('Could not reach the server. Add ?demo=1 to the address to try it offline.'); }
else { firstStatus(); await loadCounter(); await loadTokens(); await loadTerminals(); connectLive(); setInterval(loadCounter, 30000); setInterval(loadTerminals, 8000); setInterval(loadTokens, 60000); }
const hash = new URLSearchParams(location.hash.slice(1));
const hashRoom = findRoom(hash.get('room') || ''), hashAgent = findAgent(hash.get('agent') || '');
if (hashAgent) { goRoom(findRoom(hashAgent.room), true); agentPanel(hashAgent); highlightRoom(hashAgent.room); }
else if (hashRoom) { goRoom(hashRoom, true); roomPanel(hashRoom); highlightRoom(hashRoom.id); }
if (hash.get('tab')) openTab(hash.get('tab'));
const hashMeme = findAgent(hash.get('meme') || '');
if (hashMeme) setTimeout(() => meme.play(hashMeme, { hold:true, instant:true }), 900);
if (hash.get('task') && DEMO) setTimeout(() => askCeo(hash.get('task')), 600);
updateTopbar();
controls.update();
frame();
</script>
